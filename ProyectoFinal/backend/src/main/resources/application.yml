server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: rescuelink-backend

  # =============================================================================
  # PERSISTENCIA Y CONEXIÓN A POSTGRESQL + POSTGIS
  # =============================================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:rescuelink_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RescueLinkHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # =============================================================================
  # HIBERNATE Y JPA (Flyway gobierna el esquema, Hibernate solo valida)
  # =============================================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # =============================================================================
  # MIGRACIONES VERSIONADAS CON FLYWAY
  # =============================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

# =============================================================================
# SEGURIDAD Y TOKEN JWT STATELESS (RFC 7519)
# =============================================================================
application:
  security:
    jwt:
      # Clave secreta HMAC-SHA256 (256 bits mínimo)
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 900000 # 15 minutos
      refresh-token-expiration-ms: 604800000 # 7 días
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# =============================================================================
# ACTUATOR & OBSERVABILIDAD
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# =============================================================================
# DOCUMENTACIÓN OPENAPI / SWAGGER UI
# =============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
